services:
  - type: web
    name: smart-delivery-location-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false          # set manually in the Render dashboard (Neon connection string)
      - key: DATABASE_SSL
        value: "true"
      - key: CLIENT_ORIGIN
        sync: false          # set to your Vercel URL after the frontend is deployed
      - key: SERVER_BASE_URL
        sync: false          # set to this service's own Render URL (e.g. https://smart-delivery-location-api.onrender.com)
